# Network B -- control network. Deliberately left WITHOUT any policy so the
# demo can prove that MultiNetworkPolicy is scoped per-network: locking down
# net-a must not affect net-b.
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: net-b
  namespace: tenant-a
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "net-b",
      "type": "ovn-k8s-cni-overlay",
      "topology": "localnet",
      "netAttachDefName": "tenant-a/net-b",
      "physicalNetworkName": "physnet",
      "vlanID": 101,
      "subnets": "10.101.0.0/24",
      "excludeSubnets": "10.101.0.1/32"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: net-b
  namespace: tenant-b
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "net-b",
      "type": "ovn-k8s-cni-overlay",
      "topology": "localnet",
      "netAttachDefName": "tenant-b/net-b",
      "physicalNetworkName": "physnet",
      "vlanID": 101,
      "subnets": "10.101.0.0/24",
      "excludeSubnets": "10.101.0.1/32"
    }
