          nc -lk -p 8080 -e /bin/cat &
          sleep infinity
      ports:
        - containerPort: 5432
        - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-rogue
  namespace: tenant-c
  labels:
    app: probe
    role: rogue
  annotations:
    k8s.v1.cni.cncf.io/networks: |-
      [
        {"name": "net-a", "interface": "net1"}
      ]
spec:
  containers:
    - name: probe
      image: registry.access.redhat.com/ubi9/ubi:latest
      command: ["/bin/bash", "-c"]
      args:
        - |
          command -v nc >/dev/null 2>&1 || dnf install -y -q nmap-ncat iproute
          nc -lk -p 5432 -e /bin/cat &
          nc -lk -p 8080 -e /bin/cat &
          sleep infinity
      ports:
        - containerPort: 5432
        - containerPort: 8080
