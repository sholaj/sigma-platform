# Network C -- third segment, used for the VM-to-VM ICMP demonstration.
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: net-c
  namespace: tenant-a
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "net-c",
      "type": "ovn-k8s-cni-overlay",
      "topology": "localnet",
      "netAttachDefName": "tenant-a/net-c",
      "physicalNetworkName": "physnet",
      "vlanID": 102,
      "subnets": "10.102.0.0/24",
      "excludeSubnets": "10.102.0.1/32"
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: net-c
  namespace: tenant-c
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "net-c",
      "type": "ovn-k8s-cni-overlay",
      "topology": "localnet",
      "netAttachDefName": "tenant-c/net-c",
      "physicalNetworkName": "physnet",
      "vlanID": 102,
      "subnets": "10.102.0.0/24",
      "excludeSubnets": "10.102.0.1/32"
    }
