---
# Kind cluster config for the local Cilium learning environment.
#
# disableDefaultCNI: true is mandatory — kindnet would otherwise claim
# the CNI seat before Cilium can install its dataplane.
#
# kube-proxy is intentionally LEFT IN PLACE here (no kubeProxyMode: none).
# Cilium's full kube-proxy replacement is a Phase-2 learning topic; see
# docs/adr/0009-kind-cilium-learning-cluster.md.
#
# Upstream reference (fetched 2026-05-22):
#   https://docs.cilium.io/en/v1.19/installation/kind/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
  - role: worker
  - role: worker
