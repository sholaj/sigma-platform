---
customChecks: []

checks:
  exclude:
    - default-service-account     # OpenShift's restricted-v2 SCC handles this differently
    - no-rolling-update-strategy  # ArgoCD Applications false-positive on this
  include:
    - dangling-service
    - host-ipc
    - host-network
    - host-pid
    - latest-tag
    - mismatching-selector
    - no-readiness-probe
    - no-liveness-probe
    - privileged-container
    - run-as-non-root
    - unset-cpu-requirements
    - unset-memory-requirements
    - writable-host-mount
