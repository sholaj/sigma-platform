---
version: '3'

vars:
  KIND_CLUSTER: sigma-kv
  KIND_CONFIG: clusters/kind-local/kind-config.yaml
  CILIUM_VERSION: 1.19.4

tasks:
  # Default entrypoint for Cilium learning loops. Fast: just the kind
  # cluster + Cilium + Hubble. Use this when iterating on
  # CiliumNetworkPolicy, watching Hubble flows, or working through the
  # Phase-2 roadmap. See docs/adr/0009-kind-cilium-learning-cluster.md.
  up:cilium:
    desc: Bring up the kind cluster with Cilium + Hubble only (fast — Phase 2)
    cmds:
      - task: ensure-kind
      - kind create cluster --name {{.KIND_CLUSTER}} --config {{.KIND_CONFIG}} || true
      - task: install-cilium

  # Full bundle for the Phase-4 KubeVirt + MTV exercises. Slower:
  # pulls KubeVirt + CDI + Forklift operators on top of Cilium.
  up:full:
    desc: Bring up the kind cluster with Cilium + KubeVirt + Forklift (Phase 4)
    cmds:
      - task: up:cilium
      - task: install-kubevirt
      - task: install-forklift

  down:
    desc: Destroy the local kind cluster
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER}} || true

  ensure-kind:
    desc: Fail fast with a useful message if kind isn't on PATH
    silent: true
    cmds:
      - |
        if ! command -v kind >/dev/null 2>&1; then
          echo "ERROR: kind not installed. 'brew install kind'." >&2
          exit 1
        fi

  install-cilium:
    desc: Install Cilium 1.19 on kind via the upstream Helm chart (NOT OLM — that is OpenShift only)
    cmds:
      - helm repo add cilium https://helm.cilium.io/ || true
      - helm repo update
      - helm upgrade --install cilium cilium/cilium
          --version {{.CILIUM_VERSION}}
          --namespace kube-system
          --set image.pullPolicy=IfNotPresent
          --set ipam.mode=kubernetes
          --set hubble.enabled=true
          --set hubble.relay.enabled=true
          --set hubble.ui.enabled=true
      - kubectl -n kube-system rollout status ds/cilium --timeout=300s

  cilium-status:
    desc: Print Cilium status from the cilium-dbg shipped with the daemonset
    cmds:
      - kubectl -n kube-system exec ds/cilium -- cilium-dbg status

  hubble-ui:
    desc: Port-forward the Hubble UI to http://localhost:12000
    cmds:
      - echo "Hubble UI will be available at http://localhost:12000"
      - kubectl -n kube-system port-forward svc/hubble-ui 12000:80

  install-kubevirt:
    desc: Install KubeVirt + CDI on kind in software-emulation mode (Phase 4)
    cmds:
      - |
        set -euo pipefail
        KV_VERSION=$(curl -s https://api.github.com/repos/kubevirt/kubevirt/releases/latest | jq -r .tag_name)
        echo "Installing KubeVirt $KV_VERSION"
        kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KV_VERSION}/kubevirt-operator.yaml"
        kubectl apply -f "https://github.com/kubevirt/kubevirt/releases/download/${KV_VERSION}/kubevirt-cr.yaml"
        # Software emulation (kind nodes don't expose nested virt by default)
        kubectl -n kubevirt patch kubevirt kubevirt --type=merge \
          --patch '{"spec":{"configuration":{"developerConfiguration":{"useEmulation":true}}}}'
        CDI_VERSION=$(curl -s https://api.github.com/repos/kubevirt/containerized-data-importer/releases/latest | jq -r .tag_name)
        echo "Installing CDI $CDI_VERSION"
        kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-operator.yaml"
        kubectl apply -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-cr.yaml"

  install-forklift:
    desc: Install Forklift (upstream MTV) on kind (Phase 4)
    cmds:
      - kubectl create namespace konveyor-forklift --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f https://github.com/kubev2v/forklift/releases/latest/download/operator.yaml
