---
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.21.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Materialise private forbidden-terms (if secret set)
        env:
          PRIVATE_TOML: ${{ secrets.GITLEAKS_FORBIDDEN_TOML }}
        run: |
          if [ -n "$PRIVATE_TOML" ]; then
            mkdir -p "$HOME/.config/sigma-platform"
            printf '%s\n' "$PRIVATE_TOML" > "$HOME/.config/sigma-platform/gitleaks-forbidden.toml"
            echo "Private forbidden-terms materialised."
          else
            echo "::warning::GITLEAKS_FORBIDDEN_TOML secret not set; running structural rules only."
          fi

      - name: Build merged config
        id: cfg
        run: |
          MERGED="$(mktemp --suffix=.toml)"
          cat .gitleaks.toml > "$MERGED"
          if [ -f "$HOME/.config/sigma-platform/gitleaks-forbidden.toml" ]; then
            cat "$HOME/.config/sigma-platform/gitleaks-forbidden.toml" >> "$MERGED"
          fi
          echo "path=$MERGED" >> "$GITHUB_OUTPUT"

      - name: gitleaks detect (full history)
        run: |
          gitleaks detect \
            --config "${{ steps.cfg.outputs.path }}" \
            --redact \
            --no-banner \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
