---
name: schema-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBE_VERSION: "1.30.0"
  KUBECONFORM_VERSION: "0.6.7"
  KUBE_LINTER_VERSION: "0.7.2"

jobs:
  schema-validate:
    name: schema-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Discover manifests under gitops / clusters / policies
        id: scan
        run: |
          set -euo pipefail
          dirs=()
          for d in gitops clusters policies; do
            if [ -d "$d" ] && find "$d" \( -name '*.yaml' -o -name '*.yml' \) -type f | grep -q .; then
              dirs+=("$d")
            fi
          done
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No manifests under gitops/, clusters/, or policies/ yet — schema validation has nothing to do on this revision."
            echo "has_manifests=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifests=true" >> "$GITHUB_OUTPUT"
            ( IFS=' '; echo "dirs=${dirs[*]}" ) >> "$GITHUB_OUTPUT"
          fi

      - name: Install tooling
        if: steps.scan.outputs.has_manifests == 'true'
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          curl -sSfL "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kube-linter
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/kustomize
          sudo chmod +x /usr/local/bin/kubeconform /usr/local/bin/kube-linter /usr/local/bin/kustomize
          kubeconform -v
          kube-linter version
          kustomize version

      - name: kubeconform
        if: steps.scan.outputs.has_manifests == 'true'
        env:
          DIRS: ${{ steps.scan.outputs.dirs }}
        run: |
          set -euo pipefail
          SCHEMA_CATALOG='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          LOCAL_SCHEMAS='schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          # shellcheck disable=SC2086
          find $DIRS \( -name '*.yaml' -o -name '*.yml' \) -type f -print0 \
            | xargs -0 kubeconform \
                -strict \
                -ignore-missing-schemas \
                -kubernetes-version "$KUBE_VERSION" \
                -schema-location default \
                -schema-location "$SCHEMA_CATALOG" \
                -schema-location "$LOCAL_SCHEMAS" \
                -summary

      - name: kube-linter
        if: steps.scan.outputs.has_manifests == 'true'
        env:
          DIRS: ${{ steps.scan.outputs.dirs }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          kube-linter lint $DIRS

      - name: kustomize build (every overlay)
        if: steps.scan.outputs.has_manifests == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          overlays=(gitops/overlays/*/)
          if [ ${#overlays[@]} -eq 0 ]; then
            echo "No gitops/overlays/* present yet — skipping kustomize build pass."
            exit 0
          fi
          for overlay in "${overlays[@]}"; do
            echo "==> $overlay"
            kustomize build "$overlay" \
              | kubeconform -strict -ignore-missing-schemas -summary -
          done
